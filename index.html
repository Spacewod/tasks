    <script>
  // Этот скрипт срабатывает после того, как 404.html перенаправил нас на главную.
  // Он проверяет, есть ли сохраненный адрес, и если да — возвращает нас туда.
  (function(){
    var redirect = sessionStorage.redirect;
    delete sessionStorage.redirect;
    if (redirect && redirect != location.href) {
      history.replaceState(null, null, redirect);
    }
  })();
</script>
